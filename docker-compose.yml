services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

  finance-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "5000:8080"
    depends_on:
      - mongo
    environment:
      ApiKey: ${API_KEY}
      MongoConnectionString: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017
      ASPNETCORE_URLS: http://+:8080

volumes:
  mongo-data: